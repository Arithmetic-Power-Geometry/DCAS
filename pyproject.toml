[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "dcas"
version = "1.1.1"
description = "Discovery-Closure Adaptive Search for cost-normalized constrained black-box optimization"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26","pandas>=2.0","scipy>=1.11","matplotlib>=3.8"]
[tool.setuptools.packages.find]
where=["src"]

[project.urls]
Homepage = "https://github.com/Arithmetic-Power-Geometry/DCAS"
Repository = "https://github.com/Arithmetic-Power-Geometry/DCAS"
Issues = "https://github.com/Arithmetic-Power-Geometry/DCAS/issues"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
